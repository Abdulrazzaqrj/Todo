spring.application.name=todo-manager
server.port=${PORT:8080}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:https://todo-abdulrazzaq-llbi.onrender.com}

# Supabase PostgreSQL - Session Pooler
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.bvacjumvqmytgojkwxka}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logging
logging.level.com.example.todo=INFO

# Connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
